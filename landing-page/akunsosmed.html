    justify-content: space-between;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
    transition: opacity 0.15s ease;
  }

  .links .link-row:last-child {
    border-bottom: 1px solid var(--line);
  }

  .link-row:hover,
  .link-row:focus-visible {
    opacity: 0.55;
  }

  .link-row:focus-visible {

  }

  .link-name {

  .link-handle {

    color: var(--text-dim);
